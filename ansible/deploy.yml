---
- name: Deploy calculator service
  hosts: app_servers
  gather_facts: false

  vars:
    image_name: "YOUR_DOCKERHUB_USERNAME/calculator"
    image_tag: "latest"
    container_name: calculator
    host_port: 8090
    container_port: 8081 #changed from 8080 to 8081

  tasks:
    - name: Pull the image from Docker Hub
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull
        force_source: true

    - name: Run (or replace) the calculator container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        published_ports:
          - "{{ host_port }}:{{ container_port }}"

    - name: Wait until the app reports healthy
      ansible.builtin.uri:
        url: "http://host.docker.internal:{{ host_port }}/"
        return_content: true
      register: health
      until: health.status is defined and health.status == 200
      retries: 20
      delay: 3
      ignore_errors: true

